# «Ольховец» — приключение для мира «Новый мир».
#
# Славянское тёмное фэнтези на сломе эпох: 1929 год, старое ещё живо,
# новое уже приехало. Обе силы требуют подчинения, обе умеют отнимать.
#
# Правила формата — в README. Коротко:
#   archetypes  — кем игрок может выйти в мир; стартовые флаги открывают
#                 в сценах те действия, до которых додумался бы именно он
#   scenes[].id — уникальный идентификатор, по нему идут переходы
#   requires    — вариант показывается, только если условие выполнено
#   ending      — сцена завершает забег

world:
  title: Новый мир
  intro: |
    Тысяча девятьсот двадцать девятый. По уездам едут уполномоченные:
    считать хлеб, сводить единоличников в артели, ставить столбы под
    провода. В газетах пишут, что старый мир кончился.

    В газетах не пишут, что старый мир об этом не знает. Что в лесных
    углах по-прежнему кладут хлеб на порог, обходят колодцы стороной и
    не называют вслух то, что живёт под водой.

    Ты идёшь в Ольховец. Полтора десятка дворов, гать через болото, три
    версты от тракта. Оттуда второй месяц нет ни сводок, ни людей.

# Специализации объявлены отдельно от классов: одну и ту же выучку могут
# взять разные люди, и в руках каждого она становится своим делом. Это
# задаётся в for_class — там сочетание получает собственное описание и
# собственный флаг, по которому сцены дают ему особые действия.

subclasses:
  - id: sledopyt
    name: {m: Следопыт, f: Следопытка}
    tagline: Читает то, что осталось на земле
    description: |
      Ты умеешь смотреть под ноги и понимать, что здесь было до тебя.
    ability_bonus: {dex: 2, wis: 1}
    for_class:
      znahar:
        tagline: Знает лес и то, что по нему ходит
        description: |
          Мать водила тебя за грибами не за грибами. Ты научи{лся|лась}
          различать след зверя, след человека и третий след, который
          оставляют, когда не хотят оставлять следов.
        ability_bonus: {wis: 1}
        items: [Нож-складень]
        flags: [лесной_следопыт]
      upolnomochenniy:
        name: {m: Следователь, f: Следовательница}
        tagline: Верит обстановке, а не человеку
        description: |
          Ты два года в уголовном розыске и знаешь: люди врут, а
          обстановка нет. Сначала осмотр, потом опрос, и никогда
          наоборот.
        ability_bonus: {int: 2}
        items: [Протокольная тетрадь, Лупа]
        flags: [следователь]
      frontovik:
        name: {m: Пластун, f: Пластунка}
        tagline: Ходил в поиск и возвращался
        description: |
          Ты умеешь двигаться так, что тебя не слышно, и смотреть так,
          что видно больше, чем показывают. На войне это называлось
          поиском, а в деревне назовут вороватостью.
        ability_bonus: {dex: 1}
        items: [Финка]
        flags: [пластун]

  - id: kostoprav
    name: {m: Костоправ, f: Костоправка}
    tagline: Знает, где у человека всё держится
    description: |
      Ты умеешь чинить живое тело руками и подручными средствами.
    ability_bonus: {con: 1}
    hp_bonus: 2
    for_class:
      znahar:
        name: {m: Травник, f: Травница}
        tagline: Лечит тем, что растёт у дороги
        description: |
          Ты знаешь наперечёт, что растёт по краю болота и что из этого
          варят, а что жгут. Половина твоей науки — про тело, вторая
          половина — про то, что к телу цепляется.
        ability_bonus: {con: 1, wis: 1}
        items: [Короб с травами, Пучок зверобоя]
        flags: [травница]
      frontovik:
        name: {m: Санитар, f: Санитарка}
        tagline: Вытаскивал, пока другие стреляли
        description: |
          Ты виде{л|ла} войну с той стороны, где не убивают, а не дают
          умереть. Это оказалось страшнее и научило смотреть на людей
          внимательнее, чем хотелось бы.
        ability_bonus: {wis: 2}
        items: [Санитарная сумка]
        flags: [санитар]

  - id: knizhnik
    name: {m: Книжник, f: Книжница}
    tagline: Из тех, кто дочитывает до конца
    description: |
      Ты умеешь работать с написанным: видеть в тексте не только то, что
      там сказано, но и то, чего в нём нет.
    ability_bonus: {int: 2}
    for_class:
      znahar:
        tagline: Разбирает то, что писали до нас
        description: |
          У матери был сундук с бумагами: травники, переписанные от
          руки, и записи, которые она называла «уговорными». Ты
          прочита{л|ла} их все, хотя не всё поня{л|ла}.
        ability_bonus: {wis: 1}
        items: [Материн травник]
        flags: [старые_записи]
      upolnomochenniy:
        name: {m: Хозяйственник, f: Хозяйственница}
        tagline: Видит недостачу там, где другие видят цифры
        description: |
          Ты приш{ёл|ла} не из органов, а из кооперации, и умеешь
          то, чего не умеют остальные: читать отчёт и понимать, чего в
          нём нет.
        ability_bonus: {wis: 2}
        hp_bonus: 1
        items: [Счёты, Пачка накладных]
        flags: [хозяйственник]

  - id: sheptun
    name: {m: Шептун, f: Шептуха}
    tagline: Умеет говорить с тем, что не отвечает словами
    description: |
      Тебя звали, когда корова не доилась и когда ребёнок не спал третью
      ночь. Ты умеешь говорить так, что слушают, — и знаешь,
      что слушают не только люди.
    ability_bonus: {cha: 3, con: 1}
    hp_bonus: 1
    items: [Наузы на суровой нитке, Пучок зверобоя]
    flags: [шептуха]

  - id: agitator
    name: {m: Агитатор, f: Агитаторша}
    tagline: Умеет говорить с залом и с глазу на глаз
    description: |
      Ты выступа{л|ла} в клубах, где тебя слушали стоя, и в избах, где
      тебя слушали молча. Второе труднее и полезнее.
    ability_bonus: {cha: 3}
    items: [Кипа листовок]
    flags: [агитатор]

  - id: udarnik
    name: {m: Ударник, f: Ударница}
    tagline: Шёл первым, потому что больше некому
    description: |
      Тебя ставили туда, где нужно было дойти до чужого окопа живым. Ты
      доходи{л|ла}. Об этом ты не рассказываешь, но руки помнят.
    ability_bonus: {str: 3, con: 1}
    hp_bonus: 3
    items: [Трофейный маузер]
    flags: [ударник]

classes:
  - id: znahar
    name: {m: Знахарь, f: Знахарка}
    tagline: Старое знание, материн наговор, чуж{ой|ая} в новом веке
    description: |
      Тебя учила мать, её — своя мать, и так до времён, о которых не
      помнят. Ты знаешь, чем лечат, чем откупаются и о чём не
      говорят при огне. Новая власть таких называет тёмным элементом — и
      она права ровно наполовину.

      В Ольховце жила твоя тётка. Второй месяц от неё ни слова.
    abilities: {wis: 15, cha: 12, int: 12, con: 10, dex: 9, str: 8}
    max_hp: 10
    gold: 3
    items: [Материн наговор]
    flags: [старое_знание]
    subclasses: [kostoprav, sheptun, sledopyt, knizhnik]

  - id: upolnomochenniy
    name: {m: Уполномоченный, f: Уполномоченная}
    tagline: Мандат, наган и план по хлебу
    description: |
      Ты приеха{л|ла} из уезда, и у тебя в кармане бумага с печатью.
      Задача проста: выяснить, почему Ольховец второй месяц не сдаёт
      сводок, и вернуть деревню в общий счёт.

      В нечистую силу ты не веришь. Это не упрямство — это
      должность: человеку с мандатом положено видеть саботаж.
    abilities: {cha: 13, int: 13, str: 11, con: 11, dex: 10, wis: 8}
    max_hp: 10
    gold: 20
    items: [Мандат уика, Наган]
    flags: [мандат]
    subclasses: [sledopyt, agitator, knizhnik]

  - id: frontovik
    name: {m: Фронтовик, f: Фронтовичка}
    tagline: Германская, гражданская, и после них уже ничего не страшно
    description: |
      Ты воева{л|ла} в двух войнах и верну{лся|лась}, чего не скажешь о
      большинстве. Ты виде{л|ла}, как из людей выходит жизнь, — и
      поэтому тебя трудно удивить чем бы то ни было ещё.

      В Ольховец тебя послал сельсовет соседнего Кривца: сходи, мол,
      узнай, живы ли. Своих посылать побоялись.
    abilities: {str: 13, con: 13, dex: 12, wis: 11, cha: 9, int: 8}
    max_hp: 12
    gold: 8
    items: [Шинель, Кисет]
    subclasses: [sledopyt, udarnik, kostoprav]
    flags: [видел_смерть]

start: gat

scenes:
  - id: gat
    title: Гать через болото
    text: |
      Брёвна уложены давно и просели; между ними стоит чёрная вода и не
      отражает неба. Болото молчит — ни лягушки, ни птицы, только ветер
      в осоке, и тот будто сторонится.

      Впереди, за ольшаником, крыши Ольховца. Дыма над ними нет, хотя
      время к ужину.
    options:
      - id: osmotretsya
        label: Осмотреться
        requires:
          not_flags: [осмотрел_гать]
        text: |
          Ты стоишь и смотришь дольше, чем нужно, чтобы просто идти.

          Гать подновляли, и недавно: три бревна светлее остальных. Но
          подновляли странно — с той стороны, будто чинили не дорогу
          сюда, а дорогу отсюда.

          На перилах, у самого края, привязана тряпица. Выцвела, но
          видно, что была красной.
        effects:
          - type: flag
            value: осмотрел_гать

      - id: tryapica
        label: Разглядеть тряпицу
        requires:
          flags: [осмотрел_гать]
          not_flags: [знает_про_тряпицу]
        check:
          ability: int
          dc: 10
        on_success:
          text: |
            Это не тряпица. Это обрывок кумача — того самого, из которого
            шьют лозунги к праздникам. Кто-то оторвал полосу и привязал
            её на входе в деревню.

            Так делают не с лозунгами. Так делают с оберегами.
          effects:
            - type: flag
              value: знает_про_тряпицу
        on_failure:
          text: |
            Тряпка как тряпка. Мало ли что тут навязано за столько лет.

      - id: primety
        label: Прочесть приметы
        requires:
          flags: [старое_знание]
          not_flags: [читала_приметы]
        text: |
          Ты присаживаешься у воды и смотришь, как положено смотреть.

          Болото не молчит — болото замерло. Так замирает изба, когда в
          ней стоит чужой и все ждут, когда он уйдёт. Вода у берега
          подрагивает не от ветра: её трогают снизу, осторожно, будто
          пробуют, тепло ли.

          И ещё: ни одной лягушки. Лягушки уходят первыми.
        effects:
          - type: flag
            value: читала_приметы
          - type: flag
            value: знает_что_под_водой

      - id: sledy
        label: Поискать следы
        requires:
          flags: [видел_смерть]
          not_flags: [искал_следы]
        text: |
          Ты идёшь по гати медленно, глядя под ноги, как приучила война.

          Следов много, и все в одну сторону — из деревни. Взрослые,
          дети, кто-то тащил волокушу. Уходили не торопясь, значит,
          собирались. Значит, знали заранее.

          И ни одного следа обратно. Кроме твоих.
        effects:
          - type: flag
            value: искал_следы
          - type: flag
            value: знает_что_ушли

      - id: karta
        label: Свериться с картой
        requires:
          flags: [мандат]
          not_flags: [сверился_с_картой]
        text: |
          Ты разворачиваешь уездную карту, придерживая её от ветра.

          Ольховец обозначен, гать обозначена, всё сходится. Не сходится
          другое: по карте в деревне сорок один двор. Отсюда видно
          четырнадцать крыш.

          Карта позапрошлогодняя. За два года двадцать семь дворов не
          исчезают без записи в уике.
        effects:
          - type: flag
            value: сверился_с_картой
          - type: flag
            value: знает_про_дворы

      - id: lesnoy_sled
        label: Разобрать след у кромки воды
        requires:
          flags: [лесной_следопыт]
          not_flags: [читал_след]
        text: |
          Ты присаживаешься там, где ил ещё не затянуло.

          Следы лося — старые, недельные. Следы человека — вчерашние,
          босые, к воде и не обратно. А между ними третий след, который
          мать называла «неназываемым»: не отпечаток, а вмятина, будто
          что-то тяжёлое стояло на месте, пока земля под ним не осела.

          Такой след оставляют, когда долго ждут.
        effects:
          - type: flag
            value: читал_след
          - type: flag
            value: знает_что_под_водой

      - id: travy
        label: Собрать травы у воды
        requires:
          flags: [травница]
          not_flags: [собрала_травы]
        text: |
          У болота растёт то, чего в поле не найдёшь. Ты срезаешь
          сабельник и белокрыльник, откладываешь отдельно вех — он
          пригодится, но не для лечения.

          Руки заняты привычным делом, и от этого тревога отступает.
        effects:
          - type: item_gain
            value: Сабельник
          - type: item_gain
            value: Пучок зверобоя
          - type: flag
            value: собрала_травы

      - id: idti
        label: Идти в деревню
        goto: околица

  - id: околица
    title: Околица
    text: |
      Деревня встречает тишиной — не сонной, а той, в которой
      прислушиваются. В окнах нет огня, хотя время к ужину. У третьей
      избы на пороге лежит хлеб: горбушка, обёрнутая холстиной, уже
      заветрилась.

      Посреди улицы, у колодца, сидит старуха и держит на коленях пустую
      миску. Она поднимает голову раньше, чем ты успеваешь сделать шаг.
    options:
      - id: osmotretsya
        label: Осмотреться
        requires:
          not_flags: [осмотрел_околицу]
        text: |
          Ты стоишь и считаешь, чего здесь нет.

          Нет собак. В деревне на полтора десятка дворов должно быть
          восемь собак, и хоть одна должна была залаять.

          Над крайней избой — столб с изолятором, новенький, смолёный.
          Провода на нём нет. Столб поставили и ушли.

          А на стене сельсовета висит кумач, и от него оторвана полоса
          снизу.
        effects:
          - type: flag
            value: осмотрел_околицу

      - id: hleb
        label: Разглядеть хлеб на пороге
        requires:
          flags: [осмотрел_околицу]
          not_flags: [видел_хлеб]
        text: |
          Хлеб положили дня три назад и с тех пор не трогали. Такой
          кладут не птицам.

          У соседнего порога — то же самое. И у следующего. Вся улица
          выставила откуп и ушла в избы.
        effects:
          - type: flag
            value: видел_хлеб

      - id: sanitar_osmotr
        label: Приглядеться к старухе как к больной
        requires:
          flags: [санитар]
          not_flags: [осмотрел_старуху]
        text: |
          Ты смотришь на неё так, как смотрел на вынесенных с поля:
          не в глаза, а на руки, на губы, на то, как она держит спину.

          Обезвожена. Губы сухие, кожа на тыльной стороне ладони стоит
          складкой. Она не пьёт воду — вторую неделю, если не больше.

          А миску с водой держит на коленях.
        effects:
          - type: flag
            value: осмотрел_старуху
          - type: flag
            value: знает_что_под_водой

      - id: sledovatel_osmotr
        label: Осмотреть улицу по порядку
        requires:
          flags: [следователь]
          not_flags: [осмотрел_по_порядку]
        text: |
          Ты идёшь от двора к двору и записываешь, а не рассуждаешь.

          Четырнадцать дворов жилых. Двадцать семь заколочены, и
          заколочены изнутри — гвозди загнуты с той стороны. Значит,
          хозяева уходили не через дверь.

          У колодца земля утоптана кругом, но к срубу следов нет ни
          одного. Люди ходят вокруг колодца. Никто не подходит.
        effects:
          - type: flag
            value: осмотрел_по_порядку
          - type: flag
            value: знает_что_под_водой
          - type: flag
            value: знает_про_дворы

      - id: starukha
        label: Заговорить со старухой
        goto: старуха

      - id: selsovet
        label: Зайти в сельсовет
        goto: сельсовет

      - id: kolodec
        label: Напиться из колодца
        requires:
          not_flags: [знает_что_под_водой, пил_из_колодца]
        check:
          ability: con
          dc: 14
        on_success:
          text: |
            Вода ледяная и отдаёт железом. Ты выпиваешь полковша и
            чувствуешь, как по спине идёт озноб — но отпускает.

            Старуха смотрит на тебя, и в её взгляде нет ни осуждения, ни
            жалости. Только счёт: ещё один.
          effects:
            - type: damage
              amount: 2
            - type: flag
              value: пил_из_колодца
        on_failure:
          text: |
            Вода ледяная и отдаёт железом. На третьем глотке железо
            становится вкусом крови, и колодец качается перед глазами.

            Старуха отставляет миску. Впервые за всё время.
          effects:
            - type: damage
              amount: 5
            - type: flag
              value: отравлен
            - type: flag
              value: пил_из_колодца

      - id: mimo_kolodca
        label: Обойти колодец стороной
        requires:
          flags: [знает_что_под_водой]
          not_flags: [обошёл_колодец]
        text: |
          Ты обходишь колодец по дуге, не поворачиваясь к нему спиной.

          Старуха провожает тебя взглядом и впервые за всё время
          отставляет миску.

          — Живой пришёл, — говорит она без вопроса. — Редкость.
        effects:
          - type: flag
            value: обошёл_колодец

  - id: сельсовет
    title: Сельсовет
    text: |
      Дверь не заперта. Внутри пахнет бумагой и сыростью. На стене
      портрет, под ним — стол, на столе раскрытая тетрадь и чернильница,
      в которой чернила высохли столбиком.

      Тетрадь — журнал сводок. Записи идут ровно, изо дня в день, а
      потом обрываются на середине строки.
    options:
      - id: zhurnal
        label: Прочесть последнюю запись
        requires:
          not_flags: [читал_журнал]
        text: |
          «14 августа. Обмолот идёт. Настроение бодрое. Вечером собрание
          по вопросу колодца, явка обяза»

          Дальше перо ушло вбок и прочертило страницу насквозь. Не
          дописано слово. Не поставлена точка.

          Дата — два месяца назад.
        effects:
          - type: flag
            value: читал_журнал

      - id: sobranie
        label: Найти протокол того собрания
        requires:
          flags: [читал_журнал]
        check:
          ability: int
          dc: 12
        on_success:
          text: |
            Протокол подшит отдельно, будто прятали. Почерк уже другой —
            торопливый.

            «Слушали: о колодце. Постановили: колодец засыпать, воду
            брать из Кривца. Против — единогласно. За — единогласно.»

            Против и за. Единогласно оба раза. Писавший не ошибся: он
            записал, как было.
          effects:
            - type: flag
              value: знает_про_собрание
            - type: flag
              value: знает_что_под_водой
        on_failure:
          text: |
            Бумаг много, и все не о том: разнарядки, недоимки, список на
            раскулачивание из четырёх фамилий. Протокола нет.

      - id: mandat_shkaf
        label: Вскрыть опечатанный шкаф
        requires:
          flags: [мандат]
          not_flags: [вскрыл_шкаф]
        text: |
          Печать твоего же ведомства, и ты имеешь право её сорвать.

          В шкафу — папка с делом двадцать третьего года. Засуха. Хлеба
          нет, семфонда нет, разнарядку не отменили. И заявление
          председателя в уик: просим разрешить обращение к местным
          обычаям ввиду безвыходности.

          Резолюция наискось, чужой рукой: «Суеверие. Отказать.»

          Они спросили. Им отказали. Они всё равно сделали.
        effects:
          - type: flag
            value: вскрыл_шкаф
          - type: flag
            value: знает_правду
          - type: item_gain
            value: Дело 1923 года

      - id: starye_zapisi
        label: Поискать среди бумаг не казённое
        requires:
          flags: [старые_записи]
          not_flags: [нашла_уговорную]
        text: |
          Ты перебираешь подшивку не так, как читают отчёт, а так, как
          ищут вложенный листок.

          Он находится между разнарядкой и актом приёмки: половина
          тетрадного листа, исписанная от руки, и почерк ты узнаёшь
          сразу — так писала мать, и так писали до неё.

          Это уговорная запись. Год, свидетели, чего просили и что
          обещали отдать. Внизу восемь подписей, и одна — тёткина.
        effects:
          - type: item_gain
            value: Уговорная запись
          - type: flag
            value: нашла_уговорную
          - type: flag
            value: знает_правду

      - id: nakladnye
        label: Свести накладные
        requires:
          flags: [хозяйственник]
          not_flags: [свёл_накладные]
        text: |
          Ты раскладываешь накладные по датам и берёшься за счёты.

          Сходится всё, кроме одного: с двадцать третьего года Ольховец
          сдаёт хлеб ровно по плану. Не больше, не меньше — ровно, семь
          лет подряд, в засуху и в урожай.

          Так не бывает. Урожай — это погода, а погода не умеет считать
          до плана.
        effects:
          - type: flag
            value: свёл_накладные
          - type: flag
            value: знает_правду

      - id: peredohnut
        label: Передохнуть на лавке
        requires:
          not_flags: [передохнул]
        text: |
          Ты садишься на лавку под портретом и позволяешь себе четверть
          часа ничего не делать. В сельсовете сухо и пахнет бумагой —
          после болота это почти уют.

          Дыхание выравнивается. Руки перестают мелко дрожать.
        effects:
          - type: heal
            amount: 4
          - type: flag
            value: передохнул

      - id: nazad
        label: Выйти на улицу
        goto: околица

  - id: старуха
    title: Старуха у колодца
    text: |
      Вблизи видно, что миска не пустая — в ней вода, и старуха считает
      круги на её поверхности. Круги идут сами, без ветра.

      — Поздний ты, — говорит она, не поднимая глаз. — Все поздние
      приходят. Ранние ушли по гати, пока лёд не встал.
    options:
      - id: kto_ushel
        label: Спросить, куда ушли люди
        requires:
          not_flags: [знает_что_ушли_подробно]
        text: |
          — В Кривец, куда же. Сорок дворов ушло, четырнадцать осталось.
          Кто остался — те, кто подписывал.

          Она наконец поднимает глаза, и они у неё ясные, совсем не
          старушечьи.

          — Подписавшему уходить нельзя. Уговор при нём и в Кривце
          будет.
        effects:
          - type: flag
            value: знает_что_ушли_подробно

      - id: chto_v_kolodce
        label: Спросить, что в колодце
        check:
          ability: cha
          dc: 12
        on_success:
          text: |
            — Что в колодце, то мы туда сами и спустили, — говорит она
            ровно, как о хозяйстве. — В двадцать третьем. Засуха была,
            хлеба не было, а разнарядку не сняли.

            — Оно исполнило. Дождь пошёл на третий день, и с тех пор
            Ольховец сдавал по плану, хоть ты что.

            Она замолкает и снова смотрит в миску.

            — А теперь просит обратно. По уговору положено.
          effects:
            - type: flag
              value: знает_правду
        on_failure:
          text: |
            — Что в колодце, то и в колодце, — обрывает старуха и
            отворачивается. — Не про тебя писано.

      - id: naговор
        label: Заговорить с ней по-старому
        requires:
          flags: [старое_знание]
          not_flags: [признала_свою]
        text: |
          Ты здороваешься не так, как здороваются в уезде, а так, как
          учила мать: с поклоном не человеку, а порогу за его спиной.

          Старуха замирает. Потом отставляет миску и вытирает руки о
          передник — жест хозяйки, которая наконец признала гостью.

          — Марфина племянница, — говорит она. — Марфа тебя ждала до
          последнего. Она подписывала, ей уходить было нельзя.

          Она снимает с шеи ключ на суровой нитке.

          — Изба её крайняя. Спускайся, коли пришла. Только со светом.
        effects:
          - type: flag
            value: признала_свою
          - type: flag
            value: знает_правду
          - type: item_gain
            value: Тёткин ключ

      - id: mandat_dopros
        label: Предъявить мандат и потребовать объяснений
        requires:
          flags: [мандат]
          not_flags: [предъявил_мандат]
        check:
          ability: cha
          dc: 13
        on_success:
          text: |
            Ты разворачиваешь бумагу и читаешь вслух, как читал уже
            сорок раз в сорока деревнях.

            Старуха слушает до конца. Это её и выдаёт: суеверная баба
            перебила бы.

            — Грамотная, — говорит она, когда ты складываешь мандат. —
            Двадцать лет учительствовала. Потому и протокол писала я.

            Она достаёт из-под передника ключ.

            — Раз по бумаге положено разобраться — разбирайся. Изба
            крайняя, погреб под ней. Только фонарь возьми, товарищ
            уполномоченный. Там бумагой не посветишь.
          effects:
            - type: flag
              value: предъявил_мандат
            - type: item_gain
              value: Тёткин ключ
        on_failure:
          text: |
            Старуха выслушивает мандат до последней печати и молчит
            ровно столько, чтобы стало неловко.

            — Бумага хорошая, — говорит она. — Ты её оттуда покажи,
            снизу. Может, оно грамоте обучено.

      - id: po_prostomu
        label: Сесть рядом и помолчать
        requires:
          flags: [видел_смерть]
          not_flags: [посидел_молча]
        text: |
          Ты садишься на край сруба, достаёшь кисет и сворачиваешь
          цигарку. Не спрашиваешь ничего.

          Старуха смотрит на твои руки — на то, как они держат бумагу, и
          на то, что они не дрожат.

          — Ты-то не отсюда, — говорит она наконец. — И не из уезда. Ты
          с войны.

          Она кивает сама себе.

          — С войны проще. Ты уже знаешь, что просят не всегда словами.

          Ключ она кладёт рядом с тобой на сруб, не передавая в руки.

          — Крайняя изба. Погреб под ней. Свет возьми.
        effects:
          - type: flag
            value: посидел_молча
          - type: flag
            value: знает_правду
          - type: item_gain
            value: Тёткин ключ

      - id: zveroboy
        label: Заварить зверобой
        requires:
          items: [Пучок зверобоя]
        text: |
          Ты просишь у старухи кипятку, и она без слов приносит кружку.

          Зверобой горчит так, как горчит всё, что действительно
          помогает. Мать говорила: от нутряной хвори и от чужого
          взгляда, а больше ни от чего.
        effects:
          - type: item_lose
            value: Пучок зверобоя
          - type: heal
            amount: 5

      - id: agitator_rech
        label: Говорить с ней не по бумаге
        requires:
          flags: [агитатор]
          not_flags: [говорил_по_людски]
        check:
          ability: cha
          dc: 11
        on_success:
          text: |
            Ты убираешь мандат и садишься так, чтобы глаза были на одном
            уровне. Говоришь не про сводки, а про то, что деревню
            бросили: сорок дворов ушло, а четырнадцать остались, и никто
            из уезда за два месяца не приехал.

            Кроме тебя.

            — Кроме тебя, — соглашается она. — Поздно, но приехал.

            Она достаёт ключ.
          effects:
            - type: flag
              value: говорил_по_людски
            - type: item_gain
              value: Тёткин ключ
        on_failure:
          text: |
            Ты говоришь правильные слова, и они падают в тишину, как
            камни в колодец: слышно, что глубоко, и всё.

      - id: sheptuha_slovo
        label: Сказать слово на воду в её миске
        requires:
          flags: [шептуха]
          not_flags: [сказала_слово]
        text: |
          Ты наклоняешься к миске и говоришь то, что говорят над водой,
          когда не хотят, чтобы вода передала дальше.

          Круги останавливаются. Просто останавливаются — посреди
          движения, будто кто-то на том конце перестал слушать.

          Старуха медленно поднимает голову.

          — Ох, — говорит она. — Так ты умеешь. Тогда тебе вниз, и
          тянуть нечего.
        effects:
          - type: flag
            value: сказала_слово
          - type: flag
            value: знает_правду
          - type: item_gain
            value: Тёткин ключ

      - id: fonar
        label: Попросить фонарь
        requires:
          not_flags: [есть_фонарь]
        text: |
          — Фонарь в сельсовете под лавкой, — говорит старуха, не
          оборачиваясь. — Керосину на час. Больше не понадобится: или
          управишься, или нет.
        effects:
          - type: item_gain
            value: Фонарь «летучая мышь»
          - type: flag
            value: есть_фонарь

      - id: v_izbu
        label: Идти к крайней избе
        requires:
          items: [Тёткин ключ]
        goto: погреб

      - id: nazad
        label: Отойти к сельсовету
        goto: околица

  - id: погреб
    title: Погреб под крайней избой
    text: |
      Ключ поворачивается легко, будто замок смазывали недавно. Ступени
      уходят вниз дальше, чем должен уходить деревенский погреб.

      Внизу вода по щиколотку. Она движется — медленно, против твоего
      шага, как будто кто-то внизу дышит.
    options:
      - id: zazhech
        label: Зажечь фонарь
        requires:
          items: [Фонарь «летучая мышь»]
          not_flags: [есть_свет]
        text: |
          Фитиль занимается с третьего раза. Свет выхватывает стены:
          кирпич, потёки, полки с пустыми банками — обычный погреб.

          И то, что стоит у дальней стены, отворачивается от света.

          Оно не любит, когда его видят. Это уже кое-что: значит, ему
          есть чего стыдиться, а стыд — человеческое.
        effects:
          - type: flag
            value: есть_свет
        goto: встреча

      - id: plastun_hod
        label: Пройти в темноте по-пластунски
        requires:
          flags: [пластун]
          not_flags: [прошёл_тихо]
        text: |
          Ты опускаешься и идёшь так, как ходил по нейтральной полосе:
          вес на руках, ногу ставить с носка, не дышать в такт шагам.

          Вода холодная, но она хотя бы не выдаёт — плеска нет.

          На двенадцатом шаге ты понимаешь, что уже минуту слышишь
          чужое дыхание, и оно ближе, чем должно быть. Ты
          останавливаешься там, где нужно остановиться.
        effects:
          - type: flag
            value: прошёл_тихо
        goto: встреча

      - id: v_temnote
        label: Идти в темноте на ощупь
        check:
          ability: dex
          dc: 15
        on_success:
          text: |
            Ты идёшь по стене, считая шаги. На двенадцатом стена
            кончается, и ты успеваешь отдёрнуть руку прежде, чем она
            коснётся чего-то тёплого.
          effects:
            - type: flag
              value: подошёл_вслепую
          goto: встреча
        on_failure:
          text: |
            На восьмом шаге пол уходит вниз. Ты падаешь в воду, и что-то
            придерживает тебя за лодыжку — недолго, почти ласково.
          effects:
            - type: damage
              amount: 4

      - id: nazad
        label: Подняться обратно
        goto: старуха

  - id: встреча
    title: У дальней стены
    text: |
      Оно стоит спиной — если у него есть спина. Вода вокруг ног
      успокоилась и стала как стекло.

      Оно ждёт, что ты скажешь первым. Ждёт терпеливо: шесть лет ждало,
      подождёт ещё минуту.
    options:
      - id: nazvat
        label: Назвать уговор вслух
        requires:
          flags: [знает_правду]
        check:
          ability: cha
          dc: 13
        on_success:
          text: |
            Ты говоришь вслух то, что здесь шесть лет держали при себе:
            год, засуху, разнарядку, которую не сняли. Как спустились к
            воде, потому что в уике отказали. Что обещали и чего не
            отдали.

            Названный уговор — уговор, который можно закрыть.

            Оно оборачивается. У него лицо человека, который очень давно
            ждал, чтобы кто-нибудь наконец вспомнил вслух.
          goto: финал_уговор
        on_failure:
          text: |
            Слова путаются, и на середине ты сбиваешься — не с мысли, а
            с уверенности. Оно ждёт продолжения, а продолжения у тебя
            нет.
          effects:
            - type: damage
              amount: 4

      - id: delo
        label: Прочесть ему дело двадцать третьего года
        requires:
          items: [Дело 1923 года]
        text: |
            Ты открываешь папку и читаешь вслух — от даты до резолюции.
            Заявление председателя. Просьбу. И наискось, чужой рукой:
            «Суеверие. Отказать.»

            Вода идёт рябью. Оно слушает так, как слушают приговор,
            который наконец-то зачитали правильно.

            — Отказали, — говорит оно. Голос как будто чужой, взятый
            взаймы у кого-то из подписавших. — Им. Не мне.
        effects:
          - type: flag
            value: прочёл_дело
        goto: финал_бумага

      - id: udarit
        label: Ударить, пока оно отвернулось
        check:
          ability: str
          dc: 14
        on_success:
          text: |
            Ты бьёшь в темноту, и темнота отвечает звуком рвущейся
            ткани. Вода вокруг ног разом уходит вниз, будто её выпили.
          goto: финал_тишина
        on_failure:
          text: |
            Удар проходит насквозь, а вот обратный — нет.
          effects:
            - type: damage
              amount: 5

      - id: chitat_ugovornuyu
        label: Прочесть вслух уговорную запись
        requires:
          items: [Уговорная запись]
        text: |
          Ты читаешь по бумаге, не своими словами: год, засуху,
          свидетелей. Восемь имён подряд — и тёткино последним.

          На тёткином имени оно оборачивается.

          — Эта приходила, — говорит оно. Голос взят взаймы у кого-то из
          подписавших. — Каждый год приходила. Одна из восьми.
        effects:
          - type: flag
            value: прочла_уговорную
        goto: финал_уговор

      - id: udarnik_udar
        label: Ударить первым, всем весом
        requires:
          flags: [ударник]
          not_flags: [бил_всерьёз]
        check:
          ability: str
          dc: 11
        on_success:
          text: |
            Ты не размахиваешься. Ты входишь в него плечом, как входил в
            чужой окоп: коротко, снизу, всем телом сразу.

            Темнота отвечает звуком рвущейся ткани. Вода вокруг ног
            разом уходит вниз, будто её выпили.
          effects:
            - type: flag
              value: бил_всерьёз
          goto: финал_тишина
        on_failure:
          text: |
            Ты бьёшь, и удар уходит в пустоту — а пустота оказывается
            плотной ровно настолько, чтобы отдача пришла тебе в плечо.
          effects:
            - type: damage
              amount: 3
            - type: flag
              value: бил_всерьёз

      - id: kostoprav_vzglyad
        label: Понять, что перед тобой
        requires:
          flags: [костоправ]
          not_flags: [поняла_телом]
        text: |
          Ты смотришь не на очертания, а на то, как оно стоит.

          Плечи опущены неровно — правое ниже. Вес на левой ноге. Шея
          подана вперёд, как у человека, который долго носил тяжёлое на
          спине.

          Это не нечисть придумала себе тело. Это чьё-то тело, которое
          помнит работу. У него была спина, и эта спина болела.
        effects:
          - type: flag
            value: поняла_телом
          - type: flag
            value: знает_правду

      - id: otstupit
        label: Медленно отступить к лестнице
        text: |
          Ты пятишься, не опуская фонаря. Оно не идёт следом — но свет
          за твоей спиной гаснет раньше, чем ты доходишь до ступеней.
        effects:
          - type: item_lose
            value: Фонарь «летучая мышь»
          - type: flag
            value: отступил
        goto: старуха

  - id: финал_уговор
    title: Уговор закрыт
    text: |
      К утру колодец в Ольховце пересох, и оставшиеся четырнадцать
      дворов впервые за два месяца вышли на улицу при свете. Хлеб с
      порогов убрали — птицам.

      Старуха сидела на прежнем месте с пустой миской, теперь
      по-настоящему пустой.

      Тебе не сказали спасибо. В таких деревнях не говорят — там
      считают, что если человек сделал, значит, так и надо было.

      Осенью в Ольховец провели провода.

      «Уговор закрыт»
    ending: true

  - id: финал_бумага
    title: Отказать
    text: |
      Оно ушло не в воду, а в бумагу — так тебе показалось, когда папка
      потяжелела в руках.

      Ты вын{ёс|если} дело двадцать третьего года наверх и отда{л|ла} в уик, где его
      подшили в архив и больше не открывали. Ольховец после этого сдавал
      по плану ещё три года, а потом деревню свели в укрупнённый колхоз,
      и вопрос отпал сам.

      Иногда ты думаешь: то, что сидело в колодце, хотело не крови. Оно
      хотело, чтобы кто-нибудь прочёл вслух, как всё было.

      Это ведь тоже уговор — только с другой стороны.

      «Отказать»
    ending: true

  - id: финал_тишина
    title: Тишина в погребе
    text: |
      Ты выбра{лся|лась} наверх на рассвете, и в деревне снова горели окна.
      Никто не спросил, что было внизу.

      Вода в колодце с тех пор отдаёт железом сильнее прежнего, и пить
      её всё так же не стоит. Через год Ольховец расселили — официально
      по причине ветхости строений.

      Ты не увер{ен|ена}, что закрыл{|а} уговор. Ты увер{ен|ена} только,
      что оборвал{|а} его. Это разные вещи, и разницу ты чувствуешь до сих
      пор.

      «Тишина в погребе»
    ending: true
