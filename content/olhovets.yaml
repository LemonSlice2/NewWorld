# Демонстрационное приключение «Дорога в Ольховец».
#
# Это одновременно и играбельная история, и живой образец формата.
# Правила формата:
#   scenes[].id      — уникальный идентификатор, по нему идут переходы
#   options[].check  — если есть, у варианта два исхода: on_success / on_failure
#                      если нет — текст, эффекты и переход задаются прямо в варианте
#   requires         — вариант показывается, только если условие выполнено
#   effects          — damage / heal / gold / item_gain / item_lose / flag
#   ending: true     — сцена завершает забег

start: crossroads

scenes:
  - id: crossroads
    title: Перекрёсток на закате
    text: |
      Солнце садится за ельник, и от этого дорожная пыль кажется рыжей.
      Столб на перекрёстке покосился, но надпись ещё читается: «Ольховец — 3 версты».
      Кто-то перечеркнул её углём и написал ниже другое слово. Слово стёрто.

      В стороне от дороги, в канаве, лежит опрокинутая телега.
    options:
      - id: search_cart
        label: Осмотреть телегу
        check:
          ability: wis
          dc: 11
        on_success:
          text: |
            Ты обходишь телегу с подветренной стороны и сразу замечаешь то,
            чего не видно с дороги: колесо не сломано, оно снято. Аккуратно.
            Под днищем, в холщовом свёртке — масляный фонарь и несколько монет.
          effects:
            - type: item_gain
              value: Масляный фонарь
            - type: gold
              amount: 12
            - type: flag
              value: осмотрел_телегу
        on_failure:
          text: |
            Ты роешься в телеге в темноте, распарывая ладонь о торчащий гвоздь.
            Ничего, кроме прелой соломы и запаха, который не хочется узнавать.
          effects:
            - type: damage
              amount: 2

      - id: read_post
        label: Разобрать стёртую надпись
        check:
          ability: int
          dc: 13
        on_success:
          text: |
            Ты наклоняешь столб к последнему свету. Уголь стёрли, но дерево
            запомнило нажим. Под «Ольховец» кто-то написал: «НЕ ПЕЙТЕ».
          effects:
            - type: flag
              value: знает_про_воду
        on_failure:
          text: |
            Сколько ни верти столб, под углём только царапины.
            Темнеет быстрее, чем хотелось бы.

      - id: go_village
        label: Идти в Ольховец
        goto: village_gate

  - id: village_gate
    title: Околица Ольховца
    text: |
      Деревня встречает тишиной — не сонной, а той, в которой прислушиваются.
      В окнах нет огня, хотя по времени должен быть. Посреди улицы, у колодца,
      сидит старуха и перебирает пустую миску.

      Она поднимает голову раньше, чем ты делаешь шаг.
    options:
      - id: talk_elder
        label: Заговорить со старухой
        goto: elder

      - id: drink_well
        label: Напиться из колодца
        requires:
          not_flags: [знает_про_воду]
        check:
          ability: con
          dc: 14
        on_success:
          text: |
            Вода ледяная и отдаёт железом. Ты выпиваешь полковша и чувствуешь,
            как по спине идёт озноб — но отпускает.
          effects:
            - type: damage
              amount: 2
        on_failure:
          text: |
            Вода ледяная и отдаёт железом. На третьем глотке железо становится
            вкусом крови, и колодец качается перед глазами.
          effects:
            - type: damage
              amount: 6
            - type: flag
              value: отравлен

      - id: skip_well
        label: Пройти мимо колодца, не пить
        requires:
          flags: [знает_про_воду]
        text: |
          Ты обходишь колодец по дуге. Старуха провожает тебя взглядом
          и впервые за всё время перестаёт перебирать миску.
        effects:
          - type: flag
            value: не_пил
        goto: elder

  - id: elder
    title: Старуха у колодца
    text: |
      Вблизи видно, что миска не пустая — в ней вода, и старуха не перебирает,
      а считает круги на поверхности.

      — Поздний ты, — говорит она, не глядя. — Все поздние приходят.
      Пойдёшь в погреб — там оно и сидит. Не пойдёшь — оно само к утру выйдет.
    options:
      - id: ask_what
        label: Спросить, что сидит в погребе
        check:
          ability: cha
          dc: 12
        on_success:
          text: |
            — Что сидит? — Она наконец смотрит на тебя, и глаза у неё ясные,
            совсем не старушечьи. — То, что мы сами в колодец опустили,
            когда засуха была. Оно исполнило. Теперь просит обратно.

            Она суёт тебе в руку холодный ключ.
          effects:
            - type: item_gain
              value: Ключ от погреба
            - type: flag
              value: знает_правду
        on_failure:
          text: |
            — Что сидит, то и сидит, — обрывает старуха. — Языком воду не выпьешь.

      - id: go_cellar
        label: Спуститься в погреб
        requires:
          items: [Ключ от погреба]
        goto: cellar

      - id: buy_lantern
        label: Выкупить у старухи фонарь (10 монет)
        requires:
          min_gold: 10
          not_flags: [осмотрел_телегу]
        text: |
          Старуха прячет монеты в рукав так быстро, что ты не успеваешь
          проследить движение, и выставляет перед тобой закопчённый фонарь.
        effects:
          - type: gold
            amount: -10
          - type: item_gain
            value: Масляный фонарь

      - id: leave
        label: Уйти из деревни, пока не стемнело
        goto: finale_leave

  - id: cellar
    title: Погреб
    text: |
      Ступени уходят вниз дальше, чем должен уходить деревенский погреб.
      Внизу — вода по щиколотку, и она движется против твоего шага.
    options:
      - id: light_lantern
        label: Зажечь фонарь
        requires:
          items: [Масляный фонарь]
        text: |
          Фитиль занимается с третьего раза. Свет выхватывает стены —
          и то, что стоит у дальней стены, отворачивается от света.
          Оно не любит быть увиденным. Это уже кое-что.
        effects:
          - type: flag
            value: есть_свет
        goto: confrontation

      - id: go_dark
        label: Идти в темноте на ощупь
        check:
          ability: dex
          dc: 15
        on_success:
          text: |
            Ты идёшь по стене, считая шаги. На двенадцатом стена кончается,
            и ты успеваешь отдёрнуть руку прежде, чем она коснётся чего-то тёплого.
          effects:
            - type: flag
              value: подошёл_вслепую
        on_failure:
          text: |
            На восьмом шаге пол уходит вниз. Ты падаешь в воду,
            и что-то придерживает тебя за лодыжку — недолго, почти ласково.
          effects:
            - type: damage
              amount: 5

      - id: back_up
        label: Подняться обратно
        goto: elder

  - id: confrontation
    title: У дальней стены
    text: |
      Оно стоит спиной — если у него есть спина. Фонарь в твоей руке дрожит,
      и от этого тени по стенам двигаются так, будто их больше, чем должно быть.

      Оно ждёт, что ты скажешь первым.
    options:
      - id: speak_truth
        label: Назвать его тем, чем оно было
        requires:
          flags: [знает_правду]
        check:
          ability: cha
          dc: 13
        on_success:
          text: |
            Ты произносишь вслух то, что рассказала старуха: засуха, колодец,
            уговор. Имя вещи — половина власти над ней.

            Оно оборачивается. У него лицо человека, который очень давно
            ждал, чтобы кто-нибудь наконец вспомнил.
          goto: finale_release
        on_failure:
          text: |
            Слова путаются, и на середине уговора ты сбиваешься.
            Оно ждёт продолжения, а продолжения у тебя нет.
          effects:
            - type: damage
              amount: 4

      - id: attack
        label: Ударить, пока оно отвернулось
        check:
          ability: str
          dc: 14
        on_success:
          text: |
            Ты бьёшь в темноту, и темнота отвечает звуком рвущейся ткани.
            Вода вокруг ног разом уходит вниз, будто её выпили.
          goto: finale_fight
        on_failure:
          text: |
            Удар проходит насквозь, а вот обратный — нет.
          effects:
            - type: damage
              amount: 7

      - id: retreat
        label: Медленно отступить к лестнице
        text: |
          Ты пятишься, не опуская фонаря. Оно не идёт следом —
          но и свет за твоей спиной гаснет раньше, чем ты доходишь до ступеней.
        effects:
          - type: item_lose
            value: Масляный фонарь
        goto: elder

  - id: finale_release
    title: Уговор закрыт
    text: |
      К утру колодец в Ольховце пересох, и жители впервые за долгое время
      вышли на улицу при свете. Старуха сидела на прежнем месте с пустой миской —
      теперь по-настоящему пустой.

      Тебе не сказали спасибо. В таких деревнях не говорят.

      <i>Концовка: «Уговор закрыт»</i>
    ending: true

  - id: finale_fight
    title: Тишина в погребе
    text: |
      Ты выбрался наверх на рассвете, и в деревне снова горели окна.
      Никто не спросил, что было внизу. Только вода в колодце с тех пор
      отдаёт железом сильнее прежнего, и пить её всё так же не стоит.

      <i>Концовка: «Тишина в погребе»</i>
    ending: true

  - id: finale_leave
    title: Дорога обратно
    text: |
      Ты ушёл из Ольховца до темноты и к полуночи был уже далеко.
      Позади, над ельником, небо один раз посветлело — будто внизу
      открыли и сразу закрыли дверь.

      Больше ты о деревне не слышал. Её не стало на картах через год.

      <i>Концовка: «Дорога обратно»</i>
    ending: true
